<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lesson · Knowledge Garden</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a id="back" href="/" class="back">← Back</a>
      <!-- lesson.js fills these in -->
      <h1 id="lesson-title">Loading…</h1>
      <p id="lesson-meta" class="subtitle"></p>
    </header>

    <main>
      <article id="lesson-body" class="card lesson-body"></article>
      <p id="lesson-source" class="source"></p>

      <section id="quiz-section" class="quiz-section" hidden>
        <h2>Quiz</h2>
        <button id="start-quiz" class="button">Start quiz</button>
        <!-- quiz.js builds the questions inside this form -->
        <form id="quiz-form" hidden></form>
        <div id="quiz-result" class="card quiz-result" hidden></div>
      </section>
    </main>

    <!-- quiz.js first: lesson.js calls setUpQuiz(), defined in quiz.js -->
    <script src="quiz.js"></script>
    <script src="lesson.js"></script>
  </body>
</html>
