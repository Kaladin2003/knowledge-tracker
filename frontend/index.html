<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Garden</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4a37'/%3E%3Crect x='15' y='17' width='2.5' height='9' rx='1' fill='%23c9a27a'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%2382c08f'/%3E%3Ccircle cx='12.6' cy='15' r='4.8' fill='%235a9e6b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="wordmark" href="/">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="14.75" y="17" width="2.5" height="10" rx="1" fill="#c9a27a" />
            <circle cx="16" cy="12.5" r="9" fill="#82c08f" />
            <circle cx="12.2" cy="14.8" r="5.4" fill="#5a9e6b" />
          </svg>
          Knowledge Garden
        </a>
        <!-- common.js fills these two with the streak and the number of learned entries -->
        <div class="topbar-stats">
          <span id="topbar-streak" class="topbar-stat"></span>
          <span id="topbar-entries" class="topbar-stat"></span>
        </div>
      </div>
    </header>

    <main class="page home">
      <!-- The garden plate: one tree per learned entry (garden.js) -->
      <section class="plate garden-plate" aria-labelledby="garden-title">
        <div class="plate-heading">
          <h1 id="garden-title">Your garden</h1>
          <p id="garden-status">Loading…</p>
        </div>
        <div id="garden" class="garden"></div>
        <p class="plate-caption">Plate 1. Every tree is a lesson you passed. Each category grows its own kind of tree; a fully grown tree with fruit or flowers means 3 of 3 on the self-test.</p>
        <!-- Key to the trees: one species per category (garden.js) -->
        <ul id="tree-key" class="tree-key" aria-label="Key to the trees"></ul>
        <article id="tree-info" class="entry" hidden aria-live="polite"></article>
      </section>

      <div class="side">
        <!-- The next lesson to learn (app.js) -->
        <section class="plate panel" aria-labelledby="next-heading">
          <h2 id="next-heading">Next entry</h2>
          <div id="next-entry"><p class="muted">Loading…</p></div>
        </section>

        <!-- Daily streak (app.js) -->
        <section class="plate panel" aria-labelledby="streak-heading">
          <h2 id="streak-heading">Daily streak</h2>
          <div id="streak"><p class="muted">Loading…</p></div>
        </section>

        <!-- Index of topics (app.js) -->
        <section class="plate panel" aria-labelledby="index-heading">
          <h2 id="index-heading">Index</h2>
          <ol id="topics" class="index-list">
            <li class="list-message">Loading…</li>
          </ol>
          <div class="reset-row">
            <button id="reset-progress" class="text-button" type="button">Reset all progress</button>
          </div>
        </section>
      </div>
    </main>

    <script src="common.js"></script>
    <script src="trees.js"></script>
    <script src="app.js"></script>
    <script src="garden.js"></script>
  </body>
</html>
