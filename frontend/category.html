<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Category · Knowledge Garden</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4a37'/%3E%3Crect x='15' y='17' width='2.5' height='9' rx='1' fill='%23c9a27a'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%2382c08f'/%3E%3Ccircle cx='12.6' cy='15' r='4.8' fill='%235a9e6b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="wordmark" href="/">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="14.75" y="17" width="2.5" height="10" rx="1" fill="#c9a27a" />
            <circle cx="16" cy="12.5" r="9" fill="#82c08f" />
            <circle cx="12.2" cy="14.8" r="5.4" fill="#5a9e6b" />
          </svg>
          Knowledge Garden
        </a>
        <!-- search.js: results appear under the box as you type -->
        <form id="search-form" class="topbar-search" role="search">
          <label class="visually-hidden" for="search-input">Search lessons and topics</label>
          <input id="search-input" type="search" placeholder="Search lessons and topics" autocomplete="off"
                 aria-controls="search-results" aria-expanded="false" />
          <div id="search-results" class="search-results" hidden></div>
          <p id="search-status" class="visually-hidden" aria-live="polite"></p>
        </form>
        <!-- common.js fills these two with the streak and the number of learned entries -->
        <div class="topbar-stats">
          <span id="topbar-streak" class="topbar-stat"></span>
          <span id="topbar-entries" class="topbar-stat"></span>
        </div>
      </div>
    </header>

    <main class="page">
      <a href="/" class="back-link" id="back"></a>

      <!-- category.js fills the header and the list of topics -->
      <header class="topic-header">
        <span id="category-swatch"></span>
        <div>
          <h1 id="category-title">Loading…</h1>
          <p id="category-description"></p>
          <p id="category-meta" class="muted"></p>
        </div>
      </header>

      <section class="plate" aria-labelledby="category-title">
        <ol id="category-topics" class="entries">
          <li class="list-message">Loading…</li>
        </ol>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="trees.js"></script>
    <script src="search.js"></script>
    <script src="category.js"></script>
  </body>
</html>
